name: Daily catalog sync

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [manual-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Run sync + build
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python3 build/build_sync.py

      - name: Commit updated catalog
        run: |
          git config user.name "revamp-catalog-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --quiet --cached || git commit -m "Daily catalog sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
